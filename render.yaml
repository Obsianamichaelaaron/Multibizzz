databases:
  - name: multibiz-db
    databaseName: multibiz
    user: multibiz
    plan: free

services:
  - type: web
    name: multibiz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn multibiz_project.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multibiz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: multibiz
          property: host
      - key: CSRF_TRUSTED_ORIGINS
        value: https://multibiz.onrender.com
      - key: SITE_URL
        value: https://multibiz.onrender.com/